name: Bundle offline demo food photos
on:
  push:
    branches:
      - fix/offline-demo-food-photos
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up photo validation
        run: pip install Pillow
      - name: Download and verify food photos
        run: python tools/download_demo_photos.py
      - name: Commit bundled offline photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/demo_photos
          if ! git diff --cached --quiet; then
            git commit -m "Bundle validated dish-specific offline demo photos"
            git push origin HEAD:fix/offline-demo-food-photos
          fi
